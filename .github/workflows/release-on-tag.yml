name: Release On Tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  publish-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          include-prerelease: true

      - name: Restore
        run: dotnet restore src/TreePaste/TreePaste/TreePaste.csproj

      - name: Publish (win-x64 profile)
        run: >
          dotnet publish src/TreePaste/TreePaste/TreePaste.csproj
          /p:PublishProfile=Properties/PublishProfiles/win-x64.pubxml

      - name: Archive publish output
        shell: pwsh
        run: |
          $publishDir = "src/TreePaste/publish/win-x64"
          if (-not (Test-Path $publishDir)) {
            throw "Publish output not found: $publishDir"
          }

          $tagName = "${{ github.ref_name }}"
          $zipPath = "TreePaste-$tagName-win-x64.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TreePaste-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true