name: Release

on:
  push:
    tags:
      - "v*.*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (win-x64 single file)
        run: |
          dotnet publish src/TreePaste/TreePaste/TreePaste.csproj /p:PublishProfile=win-x64.pubxml -c Release

      - name: Zip artifact
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "src/TreePaste/TreePaste/bin/Release/net10.0-windows/publish/win-x64/*"  -DestinationPath "TreePaste-$tag-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TreePaste-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
